<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronak Gupta | Pro Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        
        body { 
            background-color: #050505; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* Background Aurora Effect */
        .blob-cont { position: absolute; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; filter: blur(90px); }
        .blob { position: absolute; border-radius: 50%; animation: floatGlow 12s infinite alternate ease-in-out; opacity: 0.6; }
        .blob:nth-child(1) { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #ff0055; animation-delay: 0s; }
        .blob:nth-child(2) { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #00f2fe; animation-duration: 15s; }
        .blob:nth-child(3) { top: 40%; left: 30%; width: 45vw; height: 45vw; background: #7028e4; animation-duration: 10s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, -100px) scale(1.3); }
        }

        /* Sleek Card */
        .card { 
            width: 90%; max-width: 420px; 
            background: rgba(15, 15, 20, 0.4); 
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            padding: 45px 35px; border-radius: 30px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); z-index: 1; 
        }
        
        .profile-pic { 
            width: 120px; height: 120px; border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.1); padding: 5px; margin-bottom: 20px; 
            transition: 0.5s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: cover; background: #000;
        }
        .profile-pic:hover { transform: scale(1.1) translateY(-5px); border-color: #fff; box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3); }
        
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
        p { font-size: 13px; color: #888; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;}
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 16px; text-decoration: none; color: #fff; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; transition: all 0.3s ease; font-weight: 600; }
        .btn:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 10px 20px rgba(0,0,0,0.4); color: #00f2fe; }
        .full { grid-column: span 2; }

        /* Floating Music Button */
        #music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #music-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
        #music-btn.playing { color: #00f2fe; border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
    </style>
</head>
<body>

    <!-- Floating Music Toggle Button -->
    <button id="music-btn" onclick="toggleMusic()">
        <i class="fa-solid fa-music"></i> Play Music
    </button>

    <!-- Background -->
    <div class="blob-cont">
        <div class="blob"></div><div class="blob"></div><div class="blob"></div>
    </div>

    <!-- Main Content -->
    <div class="card">
        <img src="https://files.catbox.moe/k87wks.webp" class="profile-pic" alt="Ronak Gupta">
        <h1>Ronak Gupta</h1>
        <p>Bot Developer & Tech</p>
        
        <div class="btn-grid">
            <a href="https://youtube.com/@ronakeditor101?si=Ck0IhzceWOXGyjoO" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> Channel 1</a>
            <a href="https://youtube.com/@ronakgupta32?si=pMyzD8kZEmytKKcS" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> Channel 2</a>
            <a href="https://www.instagram.com/ronakgupta236?igsh=MjZ0djlqcHZqM3o=" target="_blank" class="btn full"><i class="fa-brands fa-instagram"></i> Instagram</a>
            <a href="https://t.me/ronakgupta321" target="_blank" class="btn"><i class="fa-solid fa-rocket"></i> Deployer</a>
            <a href="https://t.me/MusicXUpdate" target="_blank" class="btn"><i class="fa-brands fa-telegram"></i> MusicX</a>
            <a href="https://github.com/ronakgupta322" target="_blank" class="btn full"><i class="fa-brands fa-github"></i> GitHub Profile</a>
        </div>
        
        <!-- Hidden Audio -->
        <audio id="bg-music" loop>
            <source src="https://files.catbox.moe/oc1sig.m4a" type="audio/mp4">
        </audio>
    </div>

    <!-- Smart Music Logic -->
    <script>
        const music = document.getElementById("bg-music");
        const musicBtn = document.getElementById("music-btn");
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = '<i class="fa-solid fa-music"></i> Play Music';
                musicBtn.classList.remove('playing');
            } else {
                music.play();
                musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
                musicBtn.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        // Try to play immediately (Works if browser allows)
        let playPromise = music.play();
        if (playPromise !== undefined) {
            playPromise.then(_ => {
                isPlaying = true;
                musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
                musicBtn.classList.add('playing');
            }).catch(error => {
                // If browser blocks, wait for first tap anywhere on screen
                document.body.addEventListener('click', function() {
                    if(!isPlaying) toggleMusic();
                }, { once: true });
                
                document.body.addEventListener('touchstart', function() {
                    if(!isPlaying) toggleMusic();
                }, { once: true });
            });
        }
    </script>
</body>
</html>
