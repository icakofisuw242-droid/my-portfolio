<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronak Gupta | Pro Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { 
            background: #0f0c29; 
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29); 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* --- STYLISH BACKGROUND ANIMATION (Bubbles) --- */
        .bg-bubbles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }
        .bg-bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px; height: 40px;
            background-color: rgba(255, 255, 255, 0.05);
            bottom: -160px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            animation: floatUp 25s infinite linear;
        }
        .bg-bubbles li:nth-child(1) { left: 10%; }
        .bg-bubbles li:nth-child(2) { left: 20%; width: 80px; height: 80px; animation-delay: 2s; animation-duration: 17s; }
        .bg-bubbles li:nth-child(3) { left: 25%; animation-delay: 4s; }
        .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 22s; background-color: rgba(255, 0, 85, 0.05); box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);}
        .bg-bubbles li:nth-child(5) { left: 70%; }
        .bg-bubbles li:nth-child(6) { left: 80%; width: 120px; height: 120px; animation-delay: 3s; background-color: rgba(255, 0, 85, 0.05); box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);}
        .bg-bubbles li:nth-child(7) { left: 32%; width: 160px; height: 160px; animation-delay: 7s; }
        .bg-bubbles li:nth-child(8) { left: 55%; width: 20px; height: 20px; animation-delay: 15s; animation-duration: 40s; }
        .bg-bubbles li:nth-child(9) { left: 25%; width: 10px; height: 10px; animation-delay: 2s; animation-duration: 40s; background-color: rgba(255, 255, 255, 0.1);}
        .bg-bubbles li:nth-child(10) { left: 90%; width: 160px; height: 160px; animation-delay: 11s; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 30%; }
        }

        /* --- CARD DESIGN --- */
        .card { 
            width: 90%; max-width: 420px; 
            background: rgba(20, 20, 20, 0.6); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px; border-radius: 25px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            z-index: 1; 
        }
        
        .profile-pic { width: 130px; height: 130px; border-radius: 50%; border: 3px solid #00f2fe; margin-bottom: 15px; transition: 0.4s; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }
        .profile-pic:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 85, 0.5); border-color: #ff0055;}
        
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 5px; }
        p { font-size: 14px; color: #aaa; margin-bottom: 25px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; text-decoration: none; color: white; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 14px; transition: 0.3s; }
        .btn:hover { transform: translateY(-3px); border-color: #fff; box-shadow: 0 5px 15px rgba(255,255,255,0.2);}
        .full { grid-column: span 2; }
        
        /* Music Player Hidden */
        .music-container { margin-top: 25px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; display: none; }
    </style>
</head>
<body>

    <!-- Animated Background Bubbles -->
    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Main Card -->
    <div class="card">
        <img src="https://files.catbox.moe/k87wks.webp" class="profile-pic" alt="Ronak Gupta">
        <h1>Ronak Gupta</h1>
        <p>Bot Developer & Tech Enthusiast</p>
        
        <div class="btn-grid">
            <a href="https://youtube.com/@ronakeditor101?si=Ck0IhzceWOXGyjoO" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> Channel 1</a>
            <a href="https://youtube.com/@ronakgupta32?si=pMyzD8kZEmytKKcS" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> Channel 2</a>
            <a href="https://www.instagram.com/ronakgupta236?igsh=MjZ0djlqcHZqM3o=" target="_blank" class="btn full"><i class="fa-brands fa-instagram"></i> Instagram</a>
            
            <!-- Update: Telegram ID replaced with Deployer -->
            <a href="https://t.me/ronakgupta321" target="_blank" class="btn"><i class="fa-solid fa-rocket"></i> Deployer</a>
            
            <a href="https://t.me/MusicXUpdate" target="_blank" class="btn"><i class="fa-brands fa-telegram"></i> MusicX Channel</a>
            <a href="https://github.com/ronakgupta322" target="_blank" class="btn full"><i class="fa-brands fa-github"></i> GitHub Profile</a>
        </div>
        
        <!-- Music without showing the player -->
        <audio id="bg-music" autoplay loop>
            <source src="https://files.catbox.moe/oc1sig.m4a" type="audio/mp4">
        </audio>
    </div>

    <!-- Script to enforce autoplay -->
    <script>
        window.onload = function() {
            let music = document.getElementById("bg-music");
            
            // Try to play immediately on load
            let playPromise = music.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Agar browser autoplay block kare, toh pehle touch par music on hoga
                    document.body.addEventListener('click', function() {
                        music.play();
                    }, { once: true });
                    
                    document.body.addEventListener('touchstart', function() {
                        music.play();
                    }, { once: true });
                });
            }
        };
    </script>
</body>
</html>
