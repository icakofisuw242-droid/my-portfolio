<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronak Gupta | Bot Deployer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        
        body { 
            background-color: #000; 
            color: #0ff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* --- CYBERPUNK HACKER GRID BACKGROUND --- */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
        }

        /* Background Glow Pulse */
        .glow-bg {
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        }

        /* --- DARK TECH CARD --- */
        .card { 
            width: 90%; max-width: 400px; 
            background: rgba(5, 5, 5, 0.85); 
            backdrop-filter: blur(10px);
            padding: 40px 30px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid rgba(0, 255, 255, 0.3); 
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.1), inset 0 0 15px rgba(0, 255, 255, 0.05); 
            z-index: 1; 
        }
        
        .profile-pic { 
            width: 130px; height: 130px; border-radius: 50%; 
            border: 2px solid #0ff; 
            padding: 4px; margin-bottom: 20px; 
            transition: 0.3s; 
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); 
            object-fit: cover; background: #000;
        }
        .profile-pic:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(0, 255, 255, 0.8); }
        
        h1 { font-size: 26px; font-weight: bold; margin-bottom: 5px; color: #fff; text-shadow: 0 0 10px #0ff; letter-spacing: 1px; }
        p { font-size: 14px; color: #0ff; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }
        
        /* --- SHARP NEON BUTTONS --- */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            padding: 14px; border-radius: 8px; 
            text-decoration: none; color: #0ff; 
            background: rgba(0, 255, 255, 0.05); 
            border: 1px solid rgba(0, 255, 255, 0.3); 
            font-size: 14px; transition: all 0.3s ease; 
            text-transform: uppercase; font-weight: bold;
            position: relative; overflow: hidden;
        }
        
        .btn:hover { 
            background: #0ff; 
            color: #000; 
            box-shadow: 0 0 20px #0ff;
            transform: translateY(-2px);
        }
        .btn i { font-size: 16px; }
        .full { grid-column: span 2; }
    </style>
</head>
<body>

    <!-- Subtle Glow behind card -->
    <div class="glow-bg"></div>

    <!-- Main Content -->
    <div class="card">
        <img src="https://files.catbox.moe/k87wks.webp" class="profile-pic" alt="Ronak Gupta">
        <h1>RONAK GUPTA</h1>
        <p><i class="fa-solid fa-terminal"></i> Bot Deployer</p>
        
        <div class="btn-grid">
            <a href="https://youtube.com/@ronakeditor101?si=Ck0IhzceWOXGyjoO" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> Channel 1</a>
            <a href="https://youtube.com/@ronakgupta32?si=pMyzD8kZEmytKKcS" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> Channel 2</a>
            <a href="https://www.instagram.com/ronakgupta236?igsh=MjZ0djlqcHZqM3o=" target="_blank" class="btn full"><i class="fa-brands fa-instagram"></i> Instagram</a>
            <a href="https://t.me/ronakgupta321" target="_blank" class="btn"><i class="fa-solid fa-rocket"></i> Deployer</a>
            <a href="https://t.me/MusicXUpdate" target="_blank" class="btn"><i class="fa-brands fa-telegram"></i> MusicX</a>
            <a href="https://github.com/ronakgupta322" target="_blank" class="btn full"><i class="fa-brands fa-github"></i> GitHub Profile</a>
        </div>
        
        <!-- Hidden Audio Element -->
        <audio id="bg-music" loop>
            <source src="https://files.catbox.moe/oc1sig.m4a" type="audio/mp4">
        </audio>
    </div>

    <!-- INVISIBLE HACKER MUSIC TRIGGER -->
    <script>
        const music = document.getElementById("bg-music");
        let isPlaying = false;

        function forcePlay() {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                }).catch((e) => {
                    // Browser waiting for user action
                });
            }
        }

        // Try playing immediately
        window.onload = forcePlay;

        // Any screen touch, click, or scroll will force music to start
        const events = ["click", "touchstart", "mousemove", "scroll", "keydown"];
        events.forEach(event => {
            document.body.addEventListener(event, forcePlay, { once: true });
        });
    </script>
</body>
</html>
