<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronak Gupta | Music Bot Deployer</title>
    <style>
        /* Font import */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
        }

        /* Mast Animated Background */
        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #020024);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Effect */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
        }

        /* Glowing Floating Profile Picture */
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #00f2fe;
            box-shadow: 0 0 25px #00f2fe;
            object-fit: cover;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Typography */
        h1 { 
            font-size: 28px; 
            font-weight: 600; 
            margin-bottom: 5px; 
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5); 
        }
        
        p { 
            font-size: 15px; 
            color: #b3b3b3; 
            margin-bottom: 30px; 
        }

        /* Buttons Styling */
        .links { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .btn {
            text-decoration: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            font-size: 14px;
        }

        /* Telegram Button */
        .btn-telegram { background: #0088cc; box-shadow: 0 0 15px rgba(0, 136, 204, 0.5); }
        .btn-telegram:hover { background: #00aaff; box-shadow: 0 0 25px #00aaff; transform: translateY(-3px); }

        /* YouTube Button */
        .btn-youtube { background: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        .btn-youtube:hover { background: #ff3333; box-shadow: 0 0 25px #ff3333; transform: translateY(-3px); }

        /* GitHub Button */
        .btn-github { background: #333; box-shadow: 0 0 15px rgba(51, 51, 51, 0.5); }
        .btn-github:hover { background: #555; box-shadow: 0 0 25px #555; transform: translateY(-3px); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Yahan apni profile photo ka link daal dena -->
        <img src="https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg" alt="Ronak Gupta" class="profile-pic">
        
        <h1>Ronak Gupta</h1>
        <p>Music Bot Deployer & Telegram Dev</p>
        
        <div class="links">
            <!-- Yahan apne links update kar lena -->
            <a href="https://t.me/Ronakgupta321" target="_blank" class="btn btn-telegram">Telegram Channel</a>
            <a href="https://youtube.com/ronakgupta131" ="_blank" class="btn btn-youtube">YouTube Channel</a>
            <a href="https://github.com/ronakgupta322" target="_blank" class="btn btn-github">GitHub Profile</a>
        </div>
    </div>

</body>
</html>
